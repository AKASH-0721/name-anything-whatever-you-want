version: "3.8"
services:
  face-recognition:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    volumes:
      - ./train:/app/train:ro
      - ./extracted_faces:/app/extracted_faces
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
